<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blocked — FocusGuard</title>
<style>
@font-face {
  font-family: "Libre Caslon Display";
  src: url("fonts/libre-caslon-display-400.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "Plex Sans";
  src: url("fonts/plex-sans-400.woff2") format("woff2");
  font-weight: 400;
}
@font-face {
  font-family: "Plex Sans";
  src: url("fonts/plex-sans-600.woff2") format("woff2");
  font-weight: 600;
}
@font-face {
  font-family: "Plex Mono";
  src: url("fonts/plex-mono-500.woff2") format("woff2");
  font-weight: 500;
}
:root {
  --ink: #14212c;
  --ink-raised: #1c2e3b;
  --ink-line: #2e4353;
  --parchment: #ede3d0;
  --parchment-dim: #8fa2af;
  --brass: #d8a44a;
  --brass-deep: #b3823a;
  --flare: #c15c4e;
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: "Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  max-width: 440px;
  width: 90%;
  background: var(--ink-raised);
  border: 1px solid var(--ink-line);
  border-radius: 14px;
  padding: 40px 36px;
  text-align: center;
}
.beacon {
  width: 52px;
  height: 52px;
  margin: 0 auto 22px;
  color: var(--brass);
}
.beacon svg { width: 100%; height: 100%; }
h1 {
  font-family: "Libre Caslon Display", serif;
  font-weight: 400;
  font-size: 23px;
  margin: 0 0 10px;
}
p {
  color: var(--parchment-dim);
  font-size: 14px;
  line-height: 1.65;
  margin: 0 0 24px;
}
.hl { color: var(--parchment); font-weight: 600; }
#countdown {
  display: none;
  margin: -10px 0 24px;
  font-family: "Plex Mono", monospace;
  font-size: 16px;
  font-weight: 500;
  color: var(--brass);
}
.actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}
button {
  font-family: "Plex Sans", sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 8px;
  border: 1px solid var(--ink-line);
  background: transparent;
  color: var(--parchment);
  cursor: pointer;
}
button.primary {
  background: var(--brass);
  color: var(--ink);
  border-color: var(--brass);
}
</style>
</head>
<body>
  <div class="card">
    <div class="beacon" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11.5 L3 8" stroke-width="1.3" opacity="0.5"/>
        <path d="M23 11.5 L29 8" stroke-width="1.3" opacity="0.5"/>
        <path d="M16 6.5 L16 1.5" stroke-width="1.3" opacity="0.5"/>
        <path d="M11.5 8.5 L16 4.5 L20.5 8.5" />
        <rect x="12.5" y="8.5" width="7" height="4.5" />
        <path d="M11 28 L13.4 13 L18.6 13 L21 28" />
        <path d="M12.9 19.5 L19.1 19.5" />
        <path d="M9.3 28 L22.7 28" />
        <circle cx="16" cy="10.75" r="1.15" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <h1 id="title">This page is blocked</h1>
    <p id="message">This site is currently blocked by FocusGuard.</p>
    <div id="countdown"></div>
    <div class="actions">
      <button id="back-btn" class="primary">Go back</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
