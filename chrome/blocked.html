<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blocked — FocusGuard</title>
<style>
  :root {
    --bg: #171d27;
    --card: #212a38;
    --border: #2c3646;
    --text: #eaeef4;
    --muted: #8b98ac;
    --accent: #4fcdb0;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 420px;
    width: 90%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    text-align: center;
  }
  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #35604f, #1a3a30);
    color: var(--accent);
  }
  h1 {
    font-size: 19px;
    margin: 0 0 8px;
  }
  p {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0 0 22px;
  }
  .hl { color: var(--text); font-weight: 600; }
  #countdown {
    display: none;
    margin: -8px 0 20px;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    color: #0e1a16;
    border-color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 4 5.5v6.2C4 17 7.4 21.6 12 23c4.6-1.4 8-6 8-11.3V5.5L12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 12.2l2.1 2.1L15.3 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 id="title">This page is blocked</h1>
    <p id="message">This site is currently blocked by FocusGuard.</p>
    <div id="countdown"></div>
    <div class="actions">
      <button id="back-btn">Go back</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
